[package]
name = "flashcat"
version = "0.2.0"
edition = "2024"
description = "FlashcatUSB Pro host tool — Linux/FreeBSD/macOS"
license = "MIT"

[[bin]]
name = "flashcat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
state-machines = { version = "0.21.1", features = ["std"] }
usage = { package = "usage-rs", version = "6.12.0", features = ["completions"] }
nusb = { version = "0.2.7", features = ["tokio"] }
ratatui = "0.30.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
